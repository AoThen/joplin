# The goal of this action is to compile the Android debug build. That should
# tell us automatically if something got broken when a dependency was changed.

name: android-build-apk
on: 
  push:
    paths:
      - .github/workflows/build-android.yml
  workflow_dispatch:

jobs:
  AssembleRelease:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Install Linux dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y libsecret-1-dev

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 3

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '20'
          
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install Yarn
        run: |
          corepack enable

      - name: Install
        run:  yarn install
        env:
          SKIP_ONENOTE_CONVERTER_BUILD: 1
      
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true

      - name: Decode Keystore
        run: |
          cd packages/app-mobile/android
          echo "storePassword=${{ secrets.SIGN_STORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.SIGN_KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.SIGN_STORE_PASSWORD }}" >> keystore.properties
          echo "storeFile=kt.jksx" >> keystore.properties
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > kt.jksx

        # env:
        #     SIGN_STORE_FILE: kt.jksx
        #     SIGN_STORE_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}
        #     SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
        #     SIGN_KEY_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}

      - name: Assemble Android Release
        run: |
          cd packages/app-mobile/android
          ./gradlew assembleRelease

      - name: Prepare App
        run: |
          mkdir -p ${{ github.workspace }}/OutAPK/
          find . -name "*.apk" -exec mv {} ${{ github.workspace }}/OutAPK/joplin.apk \;

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: joplin
          path: ${{ github.workspace }}/OutAPK/*.apk


